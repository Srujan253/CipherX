services:
  # ==========================================================
  # 1. Backend Web Service (Flask API)
  # ==========================================================
  - type: web
    name: cipherx-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader words
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production

  # ==========================================================
  # 2. Frontend Static Site (React + Vite, Global CDN)
  # ==========================================================
  - type: web
    name: cipherx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cipherx-backend
          property: host
